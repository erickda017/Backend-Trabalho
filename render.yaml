services:
  - type: web
    name: disparo-zap-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 3333
      - key: WHATSAPP_SESSION_ID
        value: default
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: faturas
      - key: MIN_DELAY_MS
        value: 5000
      - key: MAX_DELAY_MS
        value: 15000
      - key: DAILY_LIMIT
        value: 300
      - key: BATCH_SIZE
        value: 20
      - key: BATCH_PAUSE_MS
        value: 600000
      - key: RETENCAO_FATURAS_DIAS
        value: 40
      - key: PIX_MAX_ARQUIVOS
        value: 400
      - key: PIX_MAX_ARQUIVO_MB
        value: 20
      - key: PIX_MAX_TOTAL_MB
        value: 800
      - key: WEBHOOK_URL
        sync: false
      - key: WEBHOOK_SECRET
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

  - type: web
    name: disparo-zap-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
